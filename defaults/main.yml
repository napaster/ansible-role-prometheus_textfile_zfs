---
# Textfile collector для node_exporter, выгребающий ZFS-метрики которые
# не отдаёт встроенный --collector.zfs (last scrub timestamp, scrub duration,
# errors, snapshot count и т.п.).
#
# Пишет `prometheus_textfile_zfs_textfile_name` в
# `prometheus_textfile_zfs_textfile_dir` каждые
# prometheus_textfile_zfs_interval_min минут через cron + по ZED-hook
# (scrub_finish/resilver_finish) сразу же.
#
# ⚠ Каталог обязан совпадать с --collector.textfile.directory у node_exporter
# НА ЭТОМ ХОСТЕ. Расхождение не даёт ни одной ошибки: node_textfile_scrape_error
# останется 0, потому что тот каталог, куда node_exporter смотрит, существует и
# разбирается — просто он другой. Метрики молча не доезжают. На Debian дефолт
# сборки — /var/lib/prometheus/node-exporter, туда же пишет пакет
# prometheus-node-exporter-collectors (путь зашит в его юнитах).

prometheus_textfile_zfs_script_dest: '/usr/local/bin/zfs_textfile_collect.sh'
prometheus_textfile_zfs_textfile_dir: '/var/lib/prometheus-node-exporter/textfile_collector'
prometheus_textfile_zfs_textfile_name: 'zfs_pools.prom'
# Владелец каталога. Если каталог принадлежит пакету (на Debian
# /var/lib/prometheus/node-exporter ставится prometheus-node-exporter как
# root:root) — ставить root/root, чтобы роль не перебивала пакет. Писателям
# это безразлично: они работают из-под root, node_exporter только читает.
prometheus_textfile_zfs_textfile_dir_owner: 'prometheus'
prometheus_textfile_zfs_textfile_dir_group: 'prometheus'
prometheus_textfile_zfs_cron_path: '/etc/cron.d/zfs_textfile_collect'
prometheus_textfile_zfs_interval_min: 5
# ZED hooks dir отличается: Debian/Proxmox=/usr/lib/zfs-linux/, Arch=/usr/lib/zfs/.
# `prometheus_textfile_zfs_zed_dir` определяется в tasks/main.yml через stat,
# а здесь — fallback для документации.
prometheus_textfile_zfs_zed_hook_dest: '{{ prometheus_textfile_zfs_zed_dir | default("/usr/lib/zfs-linux") }}/zed.d/scan_finish-prometheus.sh'
